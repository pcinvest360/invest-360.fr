document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t Garamond\", \"Times New Roman\", serif;\n  --f-sans:   \"Outfit\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n\n  /* Sizing */\n  --max-w: 1280px;\n  --pad-x: clamp(20px, 4vw, 56px);\n  --radius: 4px;\n  --radius-lg: 10px;\n\n  /* Shadows */\n  --shadow-sm: 0 1px 2px rgba(2, 31, 89, 0.05), 0 1px 1px rgba(2, 31, 89, 0.03);\n  --shadow:    0 4px 16px rgba(2, 31, 89, 0.08), 0 1px 3px rgba(2, 31, 89, 0.04);\n  --shadow-lg: 0 24px 60px rgba(2, 31, 89, 0.12), 0 8px 20px rgba(2, 31, 89, 0.06);\n\n  /* Transitions */\n  --t-fast: 150ms cubic-bezier(.4, 0, .2, 1);\n  --t: 240ms cubic-bezier(.4, 0, .2, 1);\n}\n\n/* Reset --------------------------------------------------------------------- */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }\nbody {\n  margin: 0;\n  font-family: var(--f-sans);\n  font-size: 16px;\n  line-height: 1.6;\n  color: var(--c-text);\n  background: var(--c-bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\nimg { max-width: 100%; display: block; }\na { color: inherit; text-decoration: none; }\nbutton { font-family: inherit; cursor: pointer; border: 0; background: none; }\nh1, h2, h3, h4, h5 { margin: 0; font-family: var(--f-serif); font-weight: 600; line-height: 1.15; color: var(--c-navy); letter-spacing: -0.01em; }\np { margin: 0; }\nul { margin: 0; padding: 0; list-style: none; }\n\n/* Type scale */\n.h-display { font-size: clamp(2.5rem, 5.6vw, 4.75rem); font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; }\n.h-1       { font-size: clamp(2rem, 4vw, 3.25rem); font-weight: 500; letter-spacing: -0.015em; line-height: 1.1; }\n.h-2       { font-size: clamp(1.6rem, 2.6vw, 2.25rem); font-weight: 500; letter-spacing: -0.01em; }\n.h-3       { font-size: clamp(1.25rem, 1.8vw, 1.5rem); font-weight: 600; }\n.eyebrow   { font-family: var(--f-sans); font-size: 0.75rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--c-gold); }\n.lede      { font-size: clamp(1.05rem, 1.4vw, 1.2rem); color: var(--c-muted); line-height: 1.65; }\n\n/* Layout -------------------------------------------------------------------- */\n.container { max-width: var(--max-w); margin: 0 auto; padding-left: var(--pad-x); padding-right: var(--pad-x); }\n.container-narrow { max-width: 880px; margin: 0 auto; padding-left: var(--pad-x); padding-right: var(--pad-x); }\nsection { padding: clamp(64px, 9vw, 120px) 0; }\n.section-tight { padding: clamp(48px, 6vw, 80px) 0; }\n\n/* Buttons ------------------------------------------------------------------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  padding: 14px 26px;\n  font-family: var(--f-sans);\n  font-size: 0.95rem;\n  font-weight: 500;\n  letter-spacing: 0.01em;\n  border-radius: var(--radius);\n  transition: all var(--t);\n  white-space: nowrap;\n  cursor: pointer;\n  border: 1.5px solid transparent;\n  text-align: center;\n}\n.btn-primary { background: var(--c-navy); color: var(--c-white); }\n.btn-primary:hover { background: var(--c-navy-2); transform: translateY(-1px); box-shadow: var(--shadow); }\n.btn-gold { background: var(--c-gold); color: var(--c-white); }\n.btn-gold:hover { background: var(--c-gold-2); transform: translateY(-1px); box-shadow: var(--shadow); }\n.btn-outline { background: transparent; color: var(--c-navy); border-color: var(--c-navy); }\n.btn-outline:hover { background: var(--c-navy); color: var(--c-white); }\n.btn-ghost { background: transparent; color: var(--c-navy); border-color: var(--c-line); }\n.btn-ghost:hover { border-color: var(--c-navy); background: var(--c-white); }\n.btn-on-dark { background: var(--c-gold); color: var(--c-white); }\n.btn-on-dark:hover { background: var(--c-gold-2); transform: translateY(-1px); }\n.btn-arrow::after { content: \"→\"; transition: transform var(--t); font-weight: 400; }\n.btn-arrow:hover::after { transform: translateX(4px); }\n\n/* Header / Nav -------------------------------------------------------------- */\n.site-header {\n  position: sticky;\n  top: 0;\n  z-index: 50;\n  background: rgba(251, 248, 243, 0.92);\n  backdrop-filter: saturate(140%) blur(10px);\n  -webkit-backdrop-filter: saturate(140%) blur(10px);\n  border-bottom: 1px solid var(--c-line);\n}\n.site-header__inner {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  height: 84px;\n  gap: 24px;\n}\n.brand { display: flex; align-items: center; gap: 14px; }\n.brand img { height: 56px; width: auto; }\n.brand-text {\n  display: flex; flex-direction: column; line-height: 1;\n  font-family: var(--f-serif); color: var(--c-navy);\n}\n.brand-text strong { font-weight: 600; font-size: 1.2rem; letter-spacing: 0.04em; }\n.brand-text span { font-family: var(--f-sans); font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--c-tan); margin-top: 4px; }\n.nav { display: flex; align-items: center; gap: 8px; }\n.nav a {\n  padding: 10px 16px;\n  font-size: 0.92rem;\n  font-weight: 400;\n  color: var(--c-text);\n  border-radius: var(--radius);\n  transition: color var(--t-fast);\n  position: relative;\n}\n.nav a:hover { color: var(--c-navy); }\n.nav a.is-active { color: var(--c-navy); font-weight: 500; }\n.nav a.is-active::after {\n  content: \"\"; position: absolute; left: 16px; right: 16px; bottom: 4px;\n  height: 1.5px; background: var(--c-gold);\n}\n.nav-cta { margin-left: 12px; }\n\n.nav-toggle {\n  display: none;\n  width: 44px; height: 44px;\n  align-items: center; justify-content: center;\n  color: var(--c-navy);\n}\n.nav-toggle svg { width: 24px; height: 24px; }\n\n@media (max-width: 960px) {\n  .nav-toggle { display: inline-flex; }\n  .nav {\n    position: fixed;\n    inset: 84px 0 0 0;\n    background: var(--c-bg);\n    flex-direction: column;\n    align-items: stretch;\n    padding: 24px var(--pad-x);\n    gap: 4px;\n    transform: translateY(-110%);\n    transition: transform var(--t);\n    border-bottom: 1px solid var(--c-line);\n    overflow-y: auto;\n  }\n  .nav.is-open { transform: translateY(0); }\n  .nav a { padding: 14px 0; border-bottom: 1px solid var(--c-line); }\n  .nav a.is-active::after { display: none; }\n  .nav-cta { margin: 16px 0 0; padding: 14px 26px !important; }\n}\n\n/* Footer -------------------------------------------------------------------- */\n.site-footer {\n  background: var(--c-ink);\n  color: rgba(255, 255, 255, 0.75);\n  padding: 72px 0 32px;\n  margin-top: 80px;\n}\n.site-footer h4 {\n  font-family: var(--f-sans);\n  font-size: 0.78rem;\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n  color: var(--c-gold);\n  font-weight: 500;\n  margin-bottom: 18px;\n}\n.footer-grid {\n  display: grid;\n  grid-template-columns: 1.4fr 1fr 1fr 1fr;\n  gap: 48px;\n}\n@media (max-width: 880px) {\n  .footer-grid { grid-template-columns: 1fr 1fr; gap: 40px 24px; }\n}\n@media (max-width: 480px) {\n  .footer-grid { grid-template-columns: 1fr; }\n}\n.footer-brand img { height: 64px; width: auto; margin-bottom: 18px; }\n.footer-brand p { color: rgba(255, 255, 255, 0.65); font-size: 0.92rem; line-height: 1.6; max-width: 320px; }\n.footer-list li { margin-bottom: 10px; font-size: 0.92rem; }\n.footer-list a { color: rgba(255, 255, 255, 0.78); transition: color var(--t-fast); }\n.footer-list a:hover { color: var(--c-gold); }\n.footer-bar {\n  border-top: 1px solid rgba(255, 255, 255, 0.12);\n  margin-top: 56px; padding-top: 24px;\n  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px;\n  font-size: 0.82rem;\n  color: rgba(255, 255, 255, 0.55);\n}\n.footer-bar a:hover { color: var(--c-gold); }\n\n/* Hero ---------------------------------------------------------------------- */\n.hero {\n  position: relative;\n  padding: clamp(72px, 9vw, 140px) 0 clamp(64px, 8vw, 120px);\n  overflow: hidden;\n}\n.hero::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  background:\n    radial-gradient(ellipse at 80% 10%, rgba(217, 144, 54, 0.10), transparent 50%),\n    radial-gradient(ellipse at 10% 90%, rgba(2, 31, 89, 0.06), transparent 50%);\n  pointer-events: none;\n}\n.hero__grid {\n  display: grid;\n  grid-template-columns: 1.05fr 1fr;\n  gap: clamp(40px, 6vw, 80px);\n  align-items: center;\n  position: relative;\n}\n@media (max-width: 880px) {\n  .hero__grid { grid-template-columns: 1fr; }\n}\n.hero__copy { max-width: 620px; }\n.hero__copy .eyebrow { margin-bottom: 22px; display: block; }\n.hero__copy h1 { margin-bottom: 22px; }\n.hero__copy .lede { margin-bottom: 36px; max-width: 540px; }\n.hero__ctas { display: flex; flex-wrap: wrap; gap: 14px; }\n.hero__meta {\n  display: flex; gap: 32px; margin-top: 48px; padding-top: 32px;\n  border-top: 1px solid var(--c-line); flex-wrap: wrap;\n}\n.hero__meta-item { display: flex; flex-direction: column; gap: 4px; }\n.hero__meta-item .num { font-family: var(--f-serif); font-size: 2rem; font-weight: 500; color: var(--c-navy); line-height: 1; }\n.hero__meta-item .lbl { font-size: 0.78rem; color: var(--c-muted); letter-spacing: 0.05em; text-transform: uppercase; }\n\n.hero__visual {\n  position: relative;\n  aspect-ratio: 4 / 5;\n  border-radius: var(--radius-lg);\n  overflow: hidden;\n  background: var(--c-bg-2);\n}\n.hero__visual::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  background: linear-gradient(180deg, transparent 50%, rgba(16, 25, 38, 0.35));\n  z-index: 1;\n}\n.hero__visual img { width: 100%; height: 100%; object-fit: cover; }\n.hero__badge {\n  position: absolute;\n  bottom: 24px; left: 24px;\n  z-index: 2;\n  background: rgba(255, 255, 255, 0.95);\n  border-radius: var(--radius);\n  padding: 14px 18px;\n  display: flex; align-items: center; gap: 12px;\n  box-shadow: var(--shadow);\n  max-width: 80%;\n}\n.hero__badge-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c-gold); flex-shrink: 0; box-shadow: 0 0 0 4px rgba(217, 144, 54, 0.18); }\n.hero__badge span { font-size: 0.85rem; color: var(--c-text); }\n\n/* Frame decoration */\n.frame-deco {\n  position: absolute;\n  inset: -22px -22px auto auto;\n  width: 60%;\n  height: 60%;\n  border: 1.5px solid var(--c-gold);\n  border-radius: var(--radius-lg);\n  z-index: -1;\n}\n.frame-deco--bottom { inset: auto auto -22px -22px; }\n\n/* Section header ------------------------------------------------------------ */\n.section-head { max-width: 720px; margin: 0 auto 64px; text-align: center; }\n.section-head--left { text-align: left; margin-left: 0; }\n.section-head .eyebrow { display: block; margin-bottom: 16px; }\n.section-head h2 { margin-bottom: 18px; }\n.section-head p { color: var(--c-muted); font-size: 1.05rem; }\n\n/* Solutions grid (4 piliers) ----------------------------------------------- */\n.pillars {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 24px;\n}\n@media (max-width: 980px) { .pillars { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 540px) { .pillars { grid-template-columns: 1fr; } }\n.pillar {\n  background: var(--c-white);\n  border: 1px solid var(--c-line);\n  border-radius: var(--radius-lg);\n  padding: 32px 28px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n  transition: all var(--t);\n  position: relative;\n  overflow: hidden;\n}\n.pillar:hover { transform: translateY(-4px); border-color: var(--c-gold); box-shadow: var(--shadow); }\n.pillar::after {\n  content: \"\"; position: absolute; left: 0; top: 0; height: 3px; width: 0;\n  background: var(--c-gold); transition: width var(--t);\n}\n.pillar:hover::after { width: 100%; }\n.pillar__icon {\n  width: 52px; height: 52px;\n  border-radius: var(--radius);\n  background: var(--c-bg-2);\n  display: flex; align-items: center; justify-content: center;\n  color: var(--c-navy);\n}\n.pillar__icon svg { width: 26px; height: 26px; }\n.pillar h3 { color: var(--c-navy); font-family: var(--f-serif); font-size: 1.4rem; font-weight: 600; }\n.pillar p { color: var(--c-muted); font-size: 0.95rem; line-height: 1.6; }\n.pillar__link {\n  margin-top: auto; padding-top: 12px;\n  font-size: 0.88rem; font-weight: 500; color: var(--c-navy);\n  display: inline-flex; align-items: center; gap: 6px;\n}\n.pillar__link::after { content: \"→\"; transition: transform var(--t); }\n.pillar:hover .pillar__link::after { transform: translateX(4px); }\n\n/* Approach (process) -------------------------------------------------------- */\n.approach { background: var(--c-bg-2); }\n.steps {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 32px;\n  counter-reset: step;\n}\n@media (max-width: 880px) { .steps { grid-template-columns: 1fr 1fr; gap: 24px; } }\n@media (max-width: 520px) { .steps { grid-template-columns: 1fr; } }\n.step {\n  padding-top: 32px;\n  border-top: 1.5px solid var(--c-tan);\n  position: relative;\n}\n.step::before {\n  counter-increment: step;\n  content: counter(step, decimal-leading-zero);\n  position: absolute;\n  top: -10px; left: 0;\n  background: var(--c-bg-2);\n  padding-right: 12px;\n  font-family: var(--f-serif);\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--c-gold);\n  letter-spacing: 0.1em;\n}\n.step h3 { font-size: 1.25rem; margin-bottom: 12px; }\n.step p { color: var(--c-muted); font-size: 0.95rem; }\n\n/* CTA banner ---------------------------------------------------------------- */\n.cta-banner {\n  background: var(--c-navy);\n  color: var(--c-white);\n  border-radius: var(--radius-lg);\n  padding: clamp(40px, 6vw, 72px);\n  display: grid;\n  grid-template-columns: 1.6fr 1fr;\n  gap: 40px;\n  align-items: center;\n  position: relative;\n  overflow: hidden;\n}\n.cta-banner::before {\n  content: \"\"; position: absolute; right: -100px; top: -100px;\n  width: 360px; height: 360px; border-radius: 50%;\n  background: radial-gradient(circle, rgba(217, 144, 54, 0.25), transparent 70%);\n}\n.cta-banner h2 { color: var(--c-white); margin-bottom: 12px; max-width: 580px; position: relative; }\n.cta-banner p { color: rgba(255, 255, 255, 0.75); max-width: 540px; position: relative; }\n.cta-banner__actions { display: flex; flex-direction: column; gap: 12px; align-items: flex-end; position: relative; }\n@media (max-width: 768px) {\n  .cta-banner { grid-template-columns: 1fr; padding: 36px 28px; }\n  .cta-banner__actions { align-items: stretch; }\n}\n\n/* Trust strip (certifications) --------------------------------------------- */\n.trust-strip {\n  background: var(--c-white);\n  border-top: 1px solid var(--c-line);\n  border-bottom: 1px solid var(--c-line);\n}\n.trust-strip__inner {\n  display: flex; align-items: center; justify-content: center; gap: clamp(20px, 5vw, 60px);\n  flex-wrap: wrap;\n  padding: 28px 0;\n}\n.trust-item { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 120px; }\n.trust-item .label { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--c-tan); }\n.trust-item .value { font-family: var(--f-serif); font-size: 1.1rem; color: var(--c-navy); font-weight: 600; }\n\n/* ==========================================================================\n   OFFRES — Pricing tiers\n   ========================================================================== */\n.tiers-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 28px;\n  align-items: stretch;\n}\n@media (max-width: 1000px) { .tiers-grid { grid-template-columns: 1fr; max-width: 520px; margin: 0 auto; } }\n\n.tier-card {\n  position: relative;\n  background: var(--c-white);\n  border: 1px solid var(--c-line);\n  border-radius: var(--radius-lg);\n  padding: 40px 32px;\n  display: flex;\n  flex-direction: column;\n  gap: 28px;\n  transition: all var(--t);\n}\n.tier-card:hover { border-color: var(--c-tan); box-shadow: var(--shadow); }\n\n/* Featured */\n.tier-card--featured {\n  background: var(--c-navy);\n  color: var(--c-white);\n  border-color: var(--c-navy);\n  box-shadow: var(--shadow-lg
